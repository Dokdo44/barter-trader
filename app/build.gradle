def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')

ext {
    firebaseBin   = isWindows
            ? "${rootDir}/.gradle/firebase/node_modules/.bin/firebase.cmd"
            : "${rootDir}/.gradle/firebase/node_modules/.bin/firebase"
    databasePort  = 9000
    authPort      = 9099
    testProjectId = "group8-19144"
}

android {
    namespace 'com.example.a3130_grp8_app'
    compileSdk 36


    defaultConfig {
        applicationId "com.example.a3130_grp8_app"
        minSdk 36
        targetSdk 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField 'int', 'EMULATOR_AUTH_PORT', "${project.ext.authPort}"
        buildConfigField 'int', 'EMULATOR_DATABASE_PORT', "${project.ext.databasePort}"
        buildConfigField 'String', 'PROJECT_ID', "\"${project.ext.testProjectId}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
